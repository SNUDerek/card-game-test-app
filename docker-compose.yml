services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    # Only nginx reaches this service. Browsers use the client service's origin.
    expose:
      - "${SERVER_PORT:-2567}"
    environment:
      PORT: ${SERVER_PORT:-2567}
      DATA_DIR: /app/data
      SAMPLE_CARDS_DIR: /app/cards
      AUTH_PEPPER: ${AUTH_PEPPER:?Set AUTH_PEPPER in .env}
      SIGNUP_PASSCODE: ${SIGNUP_PASSCODE:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      TRUST_CLOUDFLARE_IP: ${TRUST_CLOUDFLARE_IP:-false}
      ROOM_IDLE_TIMEOUT_MINUTES: ${ROOM_IDLE_TIMEOUT_MINUTES:-120}
    volumes:
      # Seeds a fresh workspace; the manual importer can also read this directory.
      - ./cards:/app/cards:ro
      - workspace-data:/app/data
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "${CLIENT_PORT:-8080}:80"
    environment:
      # Address shared room links should point at, port included. Leave empty to
      # use whatever address the browser loaded the page from.
      PUBLIC_CLIENT_URL: "${PUBLIC_CLIENT_URL:-}"
      # Internal address nginx proxies to; follows SERVER_PORT automatically.
      SERVER_UPSTREAM: "server:${SERVER_PORT:-2567}"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  workspace-data:
