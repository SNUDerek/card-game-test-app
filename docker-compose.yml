services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    # Listens on SERVER_PORT inside the container as well as outside it, so the
    # port you configure is the port in every log line and URL.
    ports:
      - "${SERVER_PORT:-2567}:${SERVER_PORT:-2567}"
    environment:
      PORT: ${SERVER_PORT:-2567}
      CARDS_DIR: /app/cards
    volumes:
      - ./cards:/app/cards:ro
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "${CLIENT_PORT:-8080}:80"
    environment:
      # Where browsers should reach the tabletop server. Leave empty to use this
      # same origin, which nginx proxies to the server container -- then only
      # CLIENT_PORT has to be reachable, on any hostname, with no rebuild.
      PUBLIC_SERVER_URL: "${PUBLIC_SERVER_URL:-}"
      # Address shared room links should point at, port included. Leave empty to
      # use whatever address the browser loaded the page from.
      PUBLIC_CLIENT_URL: "${PUBLIC_CLIENT_URL:-}"
      # Internal address nginx proxies to; follows SERVER_PORT automatically.
      SERVER_UPSTREAM: "server:${SERVER_PORT:-2567}"
    depends_on:
      - server
    restart: unless-stopped
